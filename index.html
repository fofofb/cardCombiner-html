<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文本组合器</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>文本组合器</h1>

        <div class="text-areas">
            <textarea id="text-area-1" placeholder="在此处输入或拖动卡片..."></textarea>
            <textarea id="text-area-2" placeholder="在此处输入或拖动卡片..."></textarea>
        </div>

        <div class="card-controls">
            <button id="add-card-btn">增加卡片</button>
            <button id="paste-card-btn">从剪贴板粘贴为卡片</button>
            <button id="export-cards-btn">导出卡片</button>
            <input type="file" id="import-cards-input" accept=".json" style="display: none;">
            <label for="import-cards-input" class="button-like-label" id="import-cards-btn">导入卡片</label>
            <button id="toggle-delete-mode-btn">删除模式</button>
        </div>

        <div id="card-container" class="card-container">
            <!-- 卡片将在此处动态添加 -->
        </div>

        <div class="copy-action">
            <button id="copy-text-btn">复制组合文本</button>
            <div id="copy-status-message" aria-live="polite" style="margin-top: 10px; min-height: 20px;"></div>
        </div>
    </div>

    <!-- Modal for Card Input -->
    <div id="card-input-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <span class="close-modal-btn">&times;</span>
            <h3 id="modal-title">增加卡片</h3>
            <input type="text" id="modal-title-input" placeholder="输入卡片标题...">
            <textarea id="modal-content-textarea" placeholder="输入卡片内容..."></textarea>
            <button id="modal-save-btn">保存</button>
            <button id="modal-cancel-btn">取消</button>
        </div>
    </div>

    <script src="script.js" defer></script>
</body>
</html>
